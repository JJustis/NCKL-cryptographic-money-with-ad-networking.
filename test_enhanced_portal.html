<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PythonCoin Enhanced Portal Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0; padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; min-height: 100vh;
        }
        .container {
            max-width: 1000px; margin: 0 auto;
            background: rgba(255,255,255,0.1);
            padding: 30px; border-radius: 20px;
            backdrop-filter: blur(10px);
        }
        .test-section {
            background: rgba(0,0,0,0.2);
            padding: 20px; border-radius: 12px; margin: 20px 0;
        }
        button {
            background: #28a745; color: white; border: none;
            padding: 12px 24px; border-radius: 8px; cursor: pointer;
            margin: 5px; font-weight: 600;
        }
        button:hover { background: #218838; }
        #results {
            background: rgba(0,0,0,0.3); padding: 15px;
            border-radius: 8px; font-family: monospace;
            white-space: pre-wrap; max-height: 400px; overflow-y: auto;
        }
        .ad-zone {
            min-height: 150px; border: 2px dashed rgba(255,255,255,0.5);
            padding: 20px; text-align: center; margin: 20px 0;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 PythonCoin Enhanced Portal Test</h1>
        
        <div class="test-section">
            <h2>Enhanced Server Tests</h2>
            <button onclick="testEnhancedClient()">Test Enhanced Client Info</button>
            <button onclick="testDiscoverClients()">Test Client Discovery</button>
            <button onclick="testNotifications()">Test Notifications</button>
            <button onclick="testGenerateCustomJS()">Test JS Generation</button>
            <button onclick="testVerifyJS()">Test JS Verification</button>
            <button onclick="openDeveloperPortal()">Open Developer Portal</button>
        </div>
        
        <div class="test-section">
            <h2>Ad Display Test</h2>
            <p>Custom JS will display ads here:</p>
            <div data-pyc-zone="test-enhanced" class="ad-zone">
                Enhanced ad zone - waiting for custom JS
            </div>
            <button onclick="loadEnhancedJS()">Load Enhanced Custom JS</button>
        </div>
        
        <div class="test-section">
            <h2>Results & Logs</h2>
            <button onclick="clearResults()">Clear Results</button>
            <div id="results">Ready for enhanced testing...</div>
        </div>
    </div>

    <script>
        const SERVER_URL = 'http://127.0.0.1:8082';
        
        function log(message) {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            results.textContent += `[${timestamp}] ${message}\n`;
            results.scrollTop = results.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('results').textContent = '';
        }
        
        async function testEnhancedClient() {
            try {
                log('Testing enhanced client info...');
                const response = await fetch(`${SERVER_URL}/client_info`);
                const data = await response.json();
                
                if (data.success) {
                    log('✅ Enhanced client info successful:');
                    log(`  Client: ${data.client.name}`);
                    log(`  Capabilities: ${data.client.capabilities.join(', ')}`);
                    log(`  Active Developers: ${data.client.active_developers}`);
                    log(`  Server Version: ${data.client.server_version}`);
                } else {
                    log('❌ Enhanced client info failed: ' + data.error);
                }
            } catch (error) {
                log('❌ Enhanced client error: ' + error.message);
            }
        }
        
        async function testDiscoverClients() {
            try {
                log('Testing client discovery...');
                const response = await fetch(`${SERVER_URL}/discover_clients`);
                const data = await response.json();
                
                if (data.success) {
                    log('✅ Client discovery successful:');
                    log(`  Found ${data.total} clients:`);
                    data.clients.forEach(client => {
                        log(`    - ${client.name}: ${client.ad_count} ads (${client.status})`);
                    });
                } else {
                    log('❌ Client discovery failed: ' + data.error);
                }
            } catch (error) {
                log('❌ Discovery error: ' + error.message);
            }
        }
        
        async function testNotifications() {
            try {
                log('Testing notifications...');
                const response = await fetch(`${SERVER_URL}/notifications`);
                const data = await response.json();
                
                if (data.success) {
                    log('✅ Notifications successful:');
                    log(`  Found ${data.count} notifications`);
                    data.notifications.forEach(notif => {
                        log(`    - ${notif.type}: ${notif.message}`);
                    });
                } else {
                    log('❌ Notifications failed: ' + data.error);
                }
            } catch (error) {
                log('❌ Notifications error: ' + error.message);
            }
        }
        
        async function testGenerateCustomJS() {
            try {
                log('Testing custom JS generation...');
                const response = await fetch(`${SERVER_URL}/generate_custom_js`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        developer_address: 'test123456789012345678901234567890',
                        client_preferences: { categories: ['cryptocurrency', 'technology'] }
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    log('✅ JS generation successful:');
                    log(`  File: ${data.js_filename}`);
                    log(`  URL: ${data.js_url}`);
                    log(`  Hash: ${data.file_hash.substring(0, 16)}...`);
                    log(`  Verification: ${data.verification_url}`);
                    
                    // Store for verification test
                    window.testJSFile = data.js_filename;
                } else {
                    log('❌ JS generation failed: ' + data.error);
                }
            } catch (error) {
                log('❌ JS generation error: ' + error.message);
            }
        }
        
        async function testVerifyJS() {
            try {
                const filename = window.testJSFile || 'custom_test123456789012345678901234567890.js';
                log(`Testing JS verification for: ${filename}`);
                
                const response = await fetch(`${SERVER_URL}/verify_js/${filename}`);
                const data = await response.json();
                
                if (data.success) {
                    log('✅ JS verification successful:');
                    log(`  File: ${data.filename}`);
                    log(`  Valid: ${data.is_valid ? 'YES' : 'NO'}`);
                    log(`  Hash Match: ${data.current_hash === data.stored_hash ? 'YES' : 'NO'}`);
                    log(`  Verified at: ${data.verified_at}`);
                } else {
                    log('❌ JS verification failed: ' + data.error);
                }
            } catch (error) {
                log('❌ Verification error: ' + error.message);
            }
        }
        
        function openDeveloperPortal() {
            log('Opening developer portal in new window...');
            window.open(`${SERVER_URL}/portal`, '_blank');
        }
        
        async function loadEnhancedJS() {
            try {
                log('Loading enhanced custom JS...');
                
                const script = document.createElement('script');
                script.src = `${SERVER_URL}/custom_test123456789012345678901234567890.js`;
                script.onload = () => {
                    log('✅ Enhanced custom JS loaded successfully');
                    log('Check the ad zone above for enhanced advertisements');
                };
                script.onerror = () => {
                    log('❌ Failed to load enhanced custom JS');
                };
                
                document.head.appendChild(script);
            } catch (error) {
                log('❌ Load enhanced JS error: ' + error.message);
            }
        }
        
        log('🚀 Enhanced PythonCoin Portal Test Ready');
        log('Features: Notifications, Client Discovery, Hash Verification');
        log('Make sure the PyQt wallet is running with Enhanced Portal Server');
    </script>
</body>
</html>
